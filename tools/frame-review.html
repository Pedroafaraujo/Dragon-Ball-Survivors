<!doctype html><html lang="pt"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspeção dos frames corrigidos</title><style>body{margin:20px;background:#10252e;color:#dcf1e6;font:14px system-ui}select,button{padding:10px;background:#173640;color:#ffe2a0;margin:8px;border:1px solid #70998c}canvas{image-rendering:pixelated;background:#29484c;max-width:100%;border:1px solid #6a928a;vertical-align:top}#detail{position:sticky;top:10px}p{max-width:900px;line-height:1.6}.layout{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}</style><h1>Inspeção de sprites completos</h1><p>Grelha de 96×96. Verde: chão. Vermelho: limites reais do corpo. Azul: âncora de emissão da mão. Clica numa célula para ampliar. O PNG é desenhado inteiro, sem juntar pernas e troncos.</p><label>Folha<select id="sheet"></select></label><p id="status"></p><div class="layout"><canvas id="atlas"></canvas><canvas id="detail" width="384" height="384"></canvas></div><script type="module">
import {FRAME_DATA,ART_STATUS} from '../src/frame-data.js';
const manifest=await fetch('../assets/animation-manifest.json').then(r=>r.json()),select=document.querySelector('#sheet'),atlas=document.querySelector('#atlas'),detail=document.querySelector('#detail');let image=null,current=null;
for(const s of manifest.sheets.filter(s=>Boolean(FRAME_DATA[s.key]))){const o=document.createElement('option');o.value=s.key;o.textContent=s.key;select.append(o);}
function marks(ctx,frame,x,y,scale){const b=FRAME_DATA[current.key][frame];ctx.lineWidth=1;ctx.strokeStyle='#e79b91';ctx.strokeRect(x+b[0]*scale,y+b[1]*scale,(b[2]-b[0])*scale,(b[3]-b[1])*scale);ctx.strokeStyle='#96d0a5';ctx.beginPath();ctx.moveTo(x,y+84*scale);ctx.lineTo(x+96*scale,y+84*scale);ctx.stroke();ctx.fillStyle='#69dcff';ctx.fillRect(x+b[4]*scale-2,y+b[5]*scale-2,4,4);}
function zoom(frame){const c=detail.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,384,384);c.drawImage(image,frame%4*96,Math.floor(frame/4)*96,96,96,0,0,384,384);marks(c,frame,0,0,4);}
async function load(){current=manifest.sheets.find(s=>s.key===select.value);image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src='../assets/'+current.runtime;});atlas.width=384;atlas.height=current.rows*96;const c=atlas.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(image,0,0);for(let i=0;i<current.frames;i++)marks(c,i,i%4*96,Math.floor(i/4)*96,1);const fallback=ART_STATUS[current.key]?.includes('fallback');document.querySelector('#status').textContent=`${current.frames} frames · ${image.width}×${image.height} · ${fallback?'Pose integral de guarda: faltam desenhos específicos desta ação nesta forma.':'Sprites completos verificados.'}`;zoom(0);}
select.onchange=load;atlas.onclick=e=>{const r=atlas.getBoundingClientRect(),col=Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)),row=Math.min(current.rows-1,Math.floor((e.clientY-r.top)/r.height*current.rows));zoom(row*4+col);};await load();
</script></html>
